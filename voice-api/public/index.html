<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TTS | โรงพยาบาล</title>
	<style>
		body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif; margin: 0; background: #f7f7f8; color: #111; }
		.container { max-width: 720px; margin: 48px auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 24px rgba(0,0,0,0.06); }
		h1 { margin-top: 0; font-size: 22px; }
		label { display: block; margin: 12px 0 6px; font-weight: 600; }
		input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
		.help { color: #666; font-size: 12px; margin-top: 4px; }
		button { margin-top: 16px; background: #111; color: #fff; border: 0; border-radius: 8px; padding: 12px 16px; font-size: 16px; cursor: pointer; }
		button:disabled { opacity: .6; cursor: not-allowed; }
		.row { display: grid; grid-template-columns: 1fr; gap: 12px; }
		@media (min-width: 640px) { .row { grid-template-columns: 1fr 1fr; } }
		.error { color: #b00020; background: #fde7ea; border: 1px solid #f6b7c0; padding: 10px 12px; border-radius: 8px; margin-top: 12px; display: none; }
	</style>
	<script>
		async function handleSubmit(event) {
			event.preventDefault();
			const text = document.getElementById('text').value.trim();
			const style = document.querySelector('input[name="style_voice"]:checked')?.value || '1';
			const btn = document.getElementById('submitBtn');
			const errBox = document.getElementById('errorBox');
			errBox.style.display = 'none';
			errBox.textContent = '';
			if (!text) {
				errBox.textContent = 'กรุณากรอกข้อความ';
				errBox.style.display = 'block';
				return;
			}
			btn.disabled = true;
			try {
				const res = await fetch('/tts', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({ text, style_voice: Number(style) })
				});
				const data = await res.json().catch(() => ({}));
				if (!res.ok) {
					throw new Error((data && (data.error || data.detail)) || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
				}
				if (!data || !data.file) {
					throw new Error('ไม่ได้รับพาธไฟล์เสียงจาก API');
				}
				// เด้งไปหน้า player เพื่อมีปุ่มกลับเสมอ
				const filePath = data.file.startsWith('http') ? data.file.replace(window.location.origin, '') : data.file;
				window.location.href = `/player?file=${encodeURIComponent(filePath)}`;
			} catch (e) {
				errBox.textContent = e.message || String(e);
				errBox.style.display = 'block';
			} finally {
				btn.disabled = false;
			}
		}

		async function handleBulk(event) {
			event.preventDefault();
			const errBox = document.getElementById('errorBox');
			const bulkBtn = document.getElementById('bulkBtn');
			const bulkResult = document.getElementById('bulkResult');
			const startLetter = document.getElementById('startLetter').value.trim().toUpperCase() || 'A';
			const endLetter = document.getElementById('endLetter').value.trim().toUpperCase() || 'Z';
			const startNumber = Number(document.getElementById('startNumber').value) || 1;
			const endNumber = Number(document.getElementById('endNumber').value) || 999;
			const order = document.getElementById('order').value;
			const overwrite = document.getElementById('overwrite').checked;
			const speakingRate = Number(document.getElementById('bulkRate').value) || undefined;
			errBox.style.display = 'none';
			errBox.textContent = '';
			bulkResult.textContent = '';
			bulkBtn.disabled = true;
			try {
				const payload = {
					start_letter: startLetter[0],
					end_letter: endLetter[0],
					start_number: startNumber,
					end_number: endNumber,
					order,
					overwrite,
					...(Number.isFinite(speakingRate) ? { speaking_rate: speakingRate } : {})
				};
				const res = await fetch('/bulk-generate-queues', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(payload)
				});
				const data = await res.json().catch(() => ({}));
				if (!res.ok) {
					throw new Error((data && (data.error || data.detail)) || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
				}
				const items = Array.isArray(data.items) ? data.items : [];
				const success = items.filter(x => !x.error).length;
				const failed = items.length - success;
				bulkResult.textContent = `สำเร็จ: ${success} รายการ, ล้มเหลว: ${failed} รายการ. ไปดูไฟล์ที่ /audio`;
			} catch (e) {
				errBox.textContent = e.message || String(e);
				errBox.style.display = 'block';
			} finally {
				bulkBtn.disabled = false;
			}
		}
	</script>
	</head>
<body>
	<div class="container">
		<h1>สร้างเสียงพูดจากข้อความ (Google TTS)</h1>
		<form onsubmit="handleSubmit(event)">
			<label for="text">ข้อความ</label>
			<input id="text" type="text" placeholder="พิมพ์คำ/ประโยค เช่น สวัสดีครับ" autofocus />
			<label>รูปแบบเสียง (style_voice)</label>
			<div>
				<label><input type="radio" name="style_voice" value="1" checked /> ผู้ชาย</label>
				<label style="margin-left:16px;"><input type="radio" name="style_voice" value="2" /> ผู้หญิง</label>
			</div>
			<button id="submitBtn" type="submit">สร้างเสียงและเปิดฟัง</button>
			<div id="errorBox" class="error"></div>
		</form>
		<hr />
		<h2>สร้างไฟล์เสียงคิวเป็นชุด (A001..Z999)</h2>
		<form onsubmit="handleBulk(event)">
			<div class="row">
				<div>
					<label for="startLetter">เริ่มตัวอักษร</label>
					<input id="startLetter" type="text" value="A" maxlength="1" />
				</div>
				<div>
					<label for="endLetter">สิ้นสุดตัวอักษร</label>
					<input id="endLetter" type="text" value="Z" maxlength="1" />
				</div>
			</div>
			<div class="row">
				<div>
					<label for="startNumber">เริ่มหมายเลข</label>
					<input id="startNumber" type="number" value="1" min="1" max="999" />
				</div>
				<div>
					<label for="endNumber">สิ้นสุดหมายเลข</label>
					<input id="endNumber" type="number" value="999" min="1" max="999" />
				</div>
			</div>
			<label for="order">ลำดับเพศ</label>
			<select id="order">
				<option value="male_first" selected>ผู้ชายก่อน ผู้หญิงตาม</option>
				<option value="female_first">ผู้หญิงก่อน ผู้ชายตาม</option>
				<option value="male">เฉพาะผู้ชาย</option>
				<option value="female">เฉพาะผู้หญิง</option>
			</select>
			<div class="row">
				<div>
					<label for="bulkRate">ความเร็วพูด (speaking_rate)</label>
					<input id="bulkRate" type="number" step="0.01" min="0.25" max="4" placeholder="1.15" />
					<div class="help">เว้นว่างเพื่อใช้ค่าเริ่มต้น 1.15</div>
				</div>
				<div>
					<label><input id="overwrite" type="checkbox" /> เขียนทับไฟล์เดิม</label>
				</div>
			</div>
			<button id="bulkBtn" type="submit">เริ่มสร้างไฟล์คิวเป็นชุด</button>
			<div id="bulkResult" class="help" style="margin-top:8px;"></div>
		</form>
	</div>
</body>
</html>
